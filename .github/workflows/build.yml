name: Build DLL

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform (match Chronicon.exe architecture)
        required: true
        default: x64
        type: choice
        options:
          - x64
          - Win32
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch YYToolkit / Aurie headers
        shell: bash
        run: |
          set -e
          raw="https://raw.githubusercontent.com/atty303/chronicon-dps/main/ChroniconDPS/include"
          api="https://api.github.com/repos/atty303/chronicon-dps/contents/ChroniconDPS/include"
          for f in YYToolkit/Shared.hpp YYToolkit/Shared.cpp Aurie/shared.hpp FunctionWrapper/FunctionWrapper.hpp; do
            mkdir -p "extern/$(dirname "$f")"
            if ! curl -fsSL --retry 3 --retry-delay 2 "$raw/$f" -o "extern/$f"; then
              echo "raw failed for $f, falling back to GitHub contents API"
              curl -fsSL --retry 3 --retry-delay 2 \
                -H "Accept: application/vnd.github.raw" \
                -H "User-Agent: ChroniconSkillMeter-build" \
                "$api/$f?ref=main" -o "extern/$f"
            fi
            test -s "extern/$f"
            echo "fetched $f ($(wc -c < "extern/$f") bytes)"
          done

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        id: build
        shell: cmd
        run: msbuild ChroniconSkillMeter.sln /m /nologo /v:minimal /fl "/flp:logfile=msbuild.log;verbosity=normal;encoding=UTF-8" /p:Configuration=Release /p:Platform=${{ github.event.inputs.platform || 'x64' }}

      # Compiler errors are also published as check-run annotations, so they can
      # be read without downloading the (private-by-default) job log.
      - name: Report compiler errors
        if: failure() && steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          if (Test-Path msbuild.log) {
            $errors = Get-Content msbuild.log | Where-Object { $_ -match 'error [A-Z]+[0-9]+' } | Select-Object -Unique -First 40
            foreach ($line in $errors) { Write-Output "::error::$($line.Trim())" }
            Write-Output "::notice::Full MSBuild log is attached as the build-log artifact."
          } else {
            Write-Output "::error::MSBuild failed before producing msbuild.log"
          }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: msbuild.log
          if-no-files-found: warn

      - name: Verify DLL exists
        shell: pwsh
        run: |
          $dll = 'bin/${{ github.event.inputs.platform || 'x64' }}/Release/ChroniconSkillMeter.dll'
          if (-not (Test-Path $dll)) { throw "DLL not produced at $dll" }
          Write-Host "built $dll"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ChroniconSkillMeter-${{ github.event.inputs.platform || 'x64' }}
          path: bin/${{ github.event.inputs.platform || 'x64' }}/Release/ChroniconSkillMeter.dll
          if-no-files-found: error
